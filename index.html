<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>P2P Full Messenger with Gemini AI</title>
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    html, body {
      width: 100%;
      max-width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #0f172a;
      color: #f8fafc;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Setup & Settings Modals */
    .setup-modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.95);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .setup-card {
      background: #1e293b;
      padding: 24px;
      border-radius: 12px;
      width: 90%;
      max-width: 440px;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .setup-card h2 { color: #38bdf8; text-align: center; }
    
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group label { font-size: 0.85rem; color: #94a3b8; }
    
    input[type="text"], input[type="password"], textarea {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
    }

    .host-toggle-btn {
      background: #334155;
      color: #38bdf8;
      border: 1px solid #38bdf8;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      text-align: center;
    }

    /* Key List Styling */
    .key-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 140px;
      overflow-y: auto;
      margin-top: 4px;
    }

    .key-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0f172a;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 0.8rem;
      border: 1px solid #334155;
    }

    .key-item .remove-key-btn {
      color: #ef4444;
      cursor: pointer;
      font-weight: bold;
      margin-left: 8px;
    }

    .add-key-row {
      display: flex;
      gap: 6px;
    }

    .add-key-row input { flex: 1; }

    /* Main Chat Layout */
    .chat-app {
      width: 100%;
      max-width: 100vw;
      height: 100vh;
      background: #1e293b;
      display: flex;
      flex-direction: column;
      border: 1px solid #334155;
      overflow: hidden;
    }

    @media (min-width: 801px) {
      .chat-app {
        max-width: 800px;
        height: 95vh;
        border-radius: 12px;
      }
    }

    .chat-header {
      padding: 12px 16px;
      background: #0f172a;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-btn-group {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .icon-btn {
      background: #334155;
      color: #fff;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .icon-btn:hover { background: #475569; }

    .room-link-btn {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .clear-chat-btn {
      background: #ef4444;
      color: #fff;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .messages-area {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message-item {
      display: flex;
      gap: 10px;
      max-width: 85%;
      align-items: flex-start;
      position: relative;
    }

    .message-item.self {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #334155;
      object-fit: cover;
    }

    .message-body {
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .bubble {
      background: #334155;
      padding: 10px 14px;
      border-radius: 12px;
      line-height: 1.4;
      font-size: 0.95rem;
      word-break: break-word;
    }

    .message-item.self .bubble { background: #0284c7; }
    .message-item.ai .bubble { background: #0d9488; }

    .reply-preview-badge {
      background: #0f172a;
      border-left: 3px solid #38bdf8;
      padding: 4px 8px;
      font-size: 0.75rem;
      border-radius: 4px;
      margin-bottom: 4px;
      color: #94a3b8;
    }

    .media-attachment img {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 6px;
      display: block;
    }

    .media-attachment audio {
      margin-top: 6px;
      max-width: 220px;
    }

    .msg-actions {
      display: flex;
      gap: 6px;
      margin-top: 4px;
      font-size: 0.75rem;
    }

    .action-btn {
      color: #64748b;
      cursor: pointer;
      user-select: none;
    }
    .action-btn:hover { color: #38bdf8; }

    .reactions-bar {
      display: flex;
      gap: 4px;
      margin-top: 4px;
      flex-wrap: wrap;
    }

    .reaction-pill {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 2px 6px;
      font-size: 0.75rem;
    }

    .reaction-picker {
      display: none;
      position: absolute;
      bottom: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 4px 8px;
      gap: 6px;
      z-index: 10;
    }

    .reaction-picker span {
      cursor: pointer;
      font-size: 1.1rem;
      transition: transform 0.1s;
    }
    .reaction-picker span:hover { transform: scale(1.3); }

    .sender-title {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-bottom: 2px;
      font-weight: bold;
    }

    .input-bar-container {
      background: #0f172a;
      border-top: 1px solid #334155;
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .active-reply-banner {
      display: none;
      padding: 6px 16px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      font-size: 0.8rem;
      color: #38bdf8;
      justify-content: space-between;
      align-items: center;
    }

    .input-bar {
      padding: 10px 8px;
      display: flex;
      gap: 6px;
      align-items: center;
      width: 100%;
    }

    .file-btn-label, .mic-btn {
      background: #334155;
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      border: none;
      color: #fff;
      flex-shrink: 0;
    }
    .mic-btn.recording {
      background: #ef4444;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    .input-bar input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 10px 8px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #1e293b;
      color: white;
    }

    .btn-submit {
      padding: 10px 14px;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .attachment-preview {
      display: none;
      padding: 4px 16px;
      font-size: 0.75rem;
      color: #a7f3d0;
    }

    .recording-indicator {
      display: none;
      padding: 4px 16px;
      font-size: 0.8rem;
      color: #ef4444;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Setup Modal -->
  <div class="setup-modal" id="setupModal">
    <div class="setup-card">
      <h2 id="modalTitle">Join Web Messenger</h2>
      
      <div class="input-group">
        <label>Display Name</label>
        <input type="text" id="usernameInput" placeholder="Enter your name..." />
      </div>

      <div class="input-group">
        <label>Avatar URL (Optional)</label>
        <input type="text" id="avatarInput" placeholder="https://..." />
      </div>

      <div class="host-toggle-btn" id="loginHostToggle" onclick="toggleHostLoginForm()">
        👑 Login / Reclaim as Host
      </div>

      <div class="input-group" id="hostPasswordGroup" style="display: none;">
        <label id="passLabel">Set Room Host Password</label>
        <input type="password" id="hostPasswordInput" placeholder="Enter host password..." />
      </div>

      <div class="input-group" id="apiKeyContainer" style="display: none;">
        <label>Primary Gemini API Key (Host)</label>
        <input type="password" id="apiKeyInput" placeholder="Paste Primary API Key..." />
      </div>

      <button class="btn-submit" onclick="initializeUser()">Enter Room</button>
    </div>
  </div>

  <!-- Host Settings Modal -->
  <div class="setup-modal" id="settingsModal" style="display: none;">
    <div class="setup-card">
      <h2>⚙️ Host API Management</h2>

      <div class="input-group">
        <label>Backup API Keys (Auto-failover on Quota Limit)</label>
        <div class="add-key-row">
          <input type="password" id="newBackupKeyInput" placeholder="Paste Backup API Key..." />
          <button class="btn-submit" style="padding: 8px 12px;" onclick="addBackupKeyFromSettings()">Add</button>
        </div>
        <div class="key-list" id="keysListContainer"></div>
      </div>

      <button class="btn-submit" onclick="closeSettingsModal()">Close</button>
    </div>
  </div>

  <!-- Chat App -->
  <div class="chat-app">
    <div class="chat-header">
      <div>
        <strong id="roomTitle">Initializing...</strong>
      </div>
      <div class="header-btn-group">
        <button class="icon-btn" id="hostSettingsBtn" style="display: none;" onclick="openSettingsModal()" title="API Settings">⚙️</button>
        <button class="clear-chat-btn" id="clearChatBtn" style="display: none;" onclick="hostClearChat()">Clear Chat</button>
        <button class="room-link-btn" onclick="copyShareLink()">Copy Invite Link</button>
      </div>
    </div>

    <div class="messages-area" id="messagesArea"></div>

    <div class="input-bar-container">
      <div class="active-reply-banner" id="activeReplyBanner">
        <span id="replyBannerText">Replying to message...</span>
        <span style="cursor:pointer;" onclick="cancelReply()">✕</span>
      </div>
      
      <div class="recording-indicator" id="recordingIndicator">🎙️ Recording voice note... (<span id="recordTimer">00:00</span> / 01:00)</div>
      <div class="attachment-preview" id="attachmentPreview"></div>

      <div class="input-bar">
        <label class="file-btn-label" for="fileInput">📎</label>
        <input type="file" id="fileInput" style="display:none;" accept="image/*,audio/*" onchange="handleFileSelect(event)" />
        <button class="mic-btn" id="micBtn" onclick="toggleVoiceRecording()" title="Record Voice Note (Up to 1 min)">🎤</button>
        <input type="text" id="chatInput" placeholder="Type /g or /gc..." />
        <button class="btn-submit" onclick="sendChatMessage()">Send</button>
      </div>
    </div>
  </div>

  <script>
    let localUser = { id: '', name: 'Guest', avatar: '', apiKey: '', hostPassword: '' };
    let peer = null;
    let connections = [];
    let hostConn = null;
    let isHost = false;
    let roomId = '';
    let chatLogs = [];

    // Multi-API Key Queue & AI Management
    let apiKeysPool = []; 
    let activeKeyIndex = 0;
    let activeModel = null;
    let isSelectingModel = false;

    let selectedReplyMsg = null;
    let pendingFile = null;

    // Voice Note Recording Variables
    let mediaRecorder = null;
    let audioChunks = [];
    let recordTimerInterval = null;
    let recordSeconds = 0;
    let isRecording = false;

    window.addEventListener('DOMContentLoaded', () => {
      const hashRoom = window.location.hash.replace('#', '');
      const savedHostRoom = localStorage.getItem('p2p_host_room_id');

      // Load saved backup keys from storage
      const savedKeys = localStorage.getItem('p2p_host_api_keys_pool');
      if (savedKeys) {
        try { apiKeysPool = JSON.parse(savedKeys); } catch(e) {}
      }

      if (!hashRoom) {
        isHost = true;
        document.getElementById('apiKeyContainer').style.display = 'flex';
        document.getElementById('hostPasswordGroup').style.display = 'flex';
        document.getElementById('passLabel').innerText = 'Set Host Access Password';
        document.getElementById('loginHostToggle').style.display = 'none';
        document.getElementById('modalTitle').innerText = 'Create Group Room (Host)';
      } else {
        isHost = false;
        roomId = hashRoom;
        document.getElementById('modalTitle').innerText = 'Join Group Room';
        if (savedHostRoom === hashRoom) {
          document.getElementById('loginHostToggle').innerText = '👑 Reclaim Host Role';
        }
      }

      const savedName = localStorage.getItem('p2p_username');
      if (savedName) document.getElementById('usernameInput').value = savedName;
    });

    function toggleHostLoginForm() {
      isHost = true;
      document.getElementById('loginHostToggle').style.display = 'none';
      document.getElementById('hostPasswordGroup').style.display = 'flex';
      document.getElementById('passLabel').innerText = 'Enter Host Access Password';
      document.getElementById('apiKeyContainer').style.display = 'flex';
      
      const savedKey = localStorage.getItem('p2p_host_api_key');
      if (savedKey) document.getElementById('apiKeyInput').value = savedKey;
      const savedPass = localStorage.getItem('p2p_host_password');
      if (savedPass) document.getElementById('hostPasswordInput').value = savedPass;
    }

    async function initializeUser() {
      const name = document.getElementById('usernameInput').value.trim();
      if (!name) return alert('Please enter a display name');

      localUser.name = name;
      localStorage.setItem('p2p_username', name);
      localUser.avatar = document.getElementById('avatarInput').value.trim() || `https://api.dicebear.com/7.x/bottts/svg?seed=${name}`;

      const passInput = document.getElementById('hostPasswordInput').value.trim();

      if (isHost) {
        localUser.apiKey = document.getElementById('apiKeyInput').value.trim();
        localUser.hostPassword = passInput;

        if (localUser.apiKey && !apiKeysPool.includes(localUser.apiKey)) {
          apiKeysPool.unshift(localUser.apiKey);
        }

        if (!roomId) roomId = 'room-' + Math.random().toString(36).substring(2, 9);

        localStorage.setItem('p2p_host_room_id', roomId);
        localStorage.setItem('p2p_host_api_key', localUser.apiKey);
        localStorage.setItem('p2p_host_password', localUser.hostPassword);
        localStorage.setItem('p2p_host_api_keys_pool', JSON.stringify(apiKeysPool));
        window.location.hash = roomId;

        document.getElementById('clearChatBtn').style.display = 'inline-block';
        document.getElementById('hostSettingsBtn').style.display = 'inline-block';
      }

      document.getElementById('setupModal').style.display = 'none';
      document.getElementById('roomTitle').innerText = isHost ? `Host ID: ${roomId}` : `Connected to Room`;

      initPeerJS();

      if (isHost && getCurrentApiKey()) {
        await findAndLockBestModel();
      }
    }

    // Key Pool Helper Functions
    function getCurrentApiKey() {
      if (apiKeysPool.length === 0 && localUser.apiKey) {
        apiKeysPool.push(localUser.apiKey);
      }
      return apiKeysPool[activeKeyIndex] || localUser.apiKey || '';
    }

    function rotateToNextApiKey() {
      if (apiKeysPool.length <= 1) return false;
      activeKeyIndex = (activeKeyIndex + 1) % apiKeysPool.length;
      appendSystemNotice(`⚠️ API quota reached. Switched to key (${activeKeyIndex + 1}/${apiKeysPool.length})...`);
      return true;
    }

    function renderKeysList() {
      const container = document.getElementById('keysListContainer');
      container.innerHTML = '';
      if (apiKeysPool.length === 0) {
        container.innerHTML = '<div style="font-size: 0.8rem; color: #64748b;">No extra API keys added.</div>';
        return;
      }

      apiKeysPool.forEach((key, idx) => {
        const item = document.createElement('div');
        item.className = 'key-item';
        const isCurrent = idx === activeKeyIndex;
        item.innerHTML = `
          <span>${isCurrent ? '🟢 ' : '⚪ '}Key #${idx + 1}: •••••${key.slice(-6)}</span>
          <span class="remove-key-btn" onclick="removeBackupKey(${idx})">✕</span>
        `;
        container.appendChild(item);
      });
    }

    function openSettingsModal() {
      renderKeysList();
      document.getElementById('settingsModal').style.display = 'flex';
    }

    function closeSettingsModal() {
      document.getElementById('settingsModal').style.display = 'none';
    }

    function addBackupKeyFromSettings() {
      const input = document.getElementById('newBackupKeyInput');
      const val = input.value.trim();
      if (!val) return;
      if (!apiKeysPool.includes(val)) {
        apiKeysPool.push(val);
        localStorage.setItem('p2p_host_api_keys_pool', JSON.stringify(apiKeysPool));
        input.value = '';
        renderKeysList();
        appendSystemNotice(`🔑 New backup API key added (Total: ${apiKeysPool.length}).`);
        if (!activeModel) findAndLockBestModel();
      }
    }

    function removeBackupKey(idx) {
      if (apiKeysPool.length <= 1) {
        return alert("You must keep at least one API key.");
      }
      apiKeysPool.splice(idx, 1);
      if (activeKeyIndex >= apiKeysPool.length) activeKeyIndex = 0;
      localStorage.setItem('p2p_host_api_keys_pool', JSON.stringify(apiKeysPool));
      renderKeysList();
    }

    // Dynamic AI Model Discovery with On-Screen UI Notifications
    async function findAndLockBestModel() {
      const apiKey = getCurrentApiKey();
      if (!apiKey || isSelectingModel) return;
      isSelectingModel = true;

      appendSystemNotice("🤖 Discovering best available Gemini AI model...");

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
        const data = await res.json();
        
        let candidateList = [];
        if (res.ok && data.models) {
          candidateList = data.models
            .filter(m => m.supportedGenerationMethods && m.supportedGenerationMethods.includes('generateContent'))
            .map(m => m.name.replace('models/', ''));

          candidateList.sort((a, b) => {
            const score = (n) => (n.includes('2.5') ? 4 : n.includes('flash') ? 3 : n.includes('pro') ? 2 : 1);
            return score(b) - score(a);
          });
        } else {
          candidateList = ['gemini-2.5-flash', 'gemini-1.5-flash', 'gemini-1.5-pro'];
        }

        for (const model of candidateList) {
          try {
            const testRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ contents: [{ role: 'user', parts: [{ text: 'ping' }] }] })
            });

            if (testRes.ok) {
              activeModel = model;
              appendSystemNotice(`✨ AI Model Active: ${activeModel}`);
              break;
            }
          } catch (e) {
            // Try next model candidate
          }
        }
      } catch (err) {
        appendSystemNotice("⚠️ Unable to load AI models. Please check your API key.");
      } finally {
        isSelectingModel = false;
      }
    }

    function initPeerJS() {
      const peerConfig = {
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' }
          ]
        }
      };

      peer = isHost ? new Peer(roomId, peerConfig) : new Peer(peerConfig);

      peer.on('open', (id) => {
        localUser.id = id;
        if (!isHost) {
          connectToHost();
        } else {
          appendSystemNotice(`Room active. Share the link to invite participants!`);
        }
      });

      peer.on('connection', (conn) => {
        connections.push(conn);
        conn.on('data', (data) => handleIncomingData(data, conn));
        conn.on('close', () => {
          connections = connections.filter(c => c !== conn);
        });
      });
    }

    function connectToHost() {
      hostConn = peer.connect(roomId);
      hostConn.on('open', () => {
        hostConn.send({ type: 'join', user: localUser });
      });
      hostConn.on('data', (data) => handleIncomingData(data));
    }

    function broadcast(data) {
      if (isHost) {
        connections.forEach(conn => conn.send(data));
      } else if (hostConn) {
        hostConn.send(data);
      }
    }

    function handleIncomingData(data, senderConn) {
      if (data.type === 'join' && isHost) {
        senderConn.send({ type: 'history_sync', history: chatLogs });
        const joinNotice = `👋 ${data.user.name} joined the conversation.`;
        appendSystemNotice(joinNotice);
        broadcast({ type: 'system_notice', text: joinNotice });

      } else if (data.type === 'history_sync') {
        chatLogs = data.history || [];
        document.getElementById('messagesArea').innerHTML = '';
        chatLogs.forEach(msg => renderMessage(msg));
        appendSystemNotice("Joined room & loaded full chat history.");

      } else if (data.type === 'system_notice') {
        appendSystemNotice(data.text);

      } else if (data.type === 'chat') {
        renderMessage(data.msg);
        chatLogs.push(data.msg);

        if (isHost) {
          connections.forEach(conn => {
            if (conn !== senderConn) conn.send(data);
          });
          checkAndTriggerAI(data.msg);
        }

      } else if (data.type === 'reaction') {
        applyReactionUI(data.msgId, data.emoji, data.senderName);
        if (isHost) {
          connections.forEach(conn => {
            if (conn !== senderConn) conn.send(data);
          });
        }

      } else if (data.type === 'clear_chat') {
        chatLogs = [];
        document.getElementById('messagesArea').innerHTML = '';
        appendSystemNotice("The host has cleared the conversation history.");
      }
    }

    function hostClearChat() {
      if (!isHost) return;
      if (confirm("Are you sure you want to clear all chat messages for everyone?")) {
        chatLogs = [];
        document.getElementById('messagesArea').innerHTML = '';
        appendSystemNotice("You cleared the conversation history.");
        broadcast({ type: 'clear_chat' });
      }
    }

    function handleFileSelect(evt) {
      const file = evt.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const base64Data = e.target.result.split(',')[1];
        const isImage = file.type.startsWith('image/');
        pendingFile = {
          base64: base64Data,
          mimeType: file.type,
          type: isImage ? 'image' : 'audio',
          url: e.target.result
        };
        document.getElementById('attachmentPreview').innerText = `Attached: ${file.name}`;
        document.getElementById('attachmentPreview').style.display = 'block';
      };
      reader.readAsDataURL(file);
    }

    // Voice Note Recorder Implementation (Max 1 minute)
    async function toggleVoiceRecording() {
      if (isRecording) {
        stopVoiceRecording();
      } else {
        startVoiceRecording();
      }
    }

    async function startVoiceRecording() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) audioChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
          const reader = new FileReader();
          reader.onload = function(e) {
            const base64Data = e.target.result.split(',')[1];
            pendingFile = {
              base64: base64Data,
              mimeType: 'audio/webm',
              type: 'audio',
              url: e.target.result
            };
            document.getElementById('attachmentPreview').innerText = `Attached Voice Note (${recordSeconds}s)`;
            document.getElementById('attachmentPreview').style.display = 'block';
          };
          reader.readAsDataURL(audioBlob);
          stream.getTracks().forEach(track => track.stop());
        };

        mediaRecorder.start();
        isRecording = true;
        recordSeconds = 0;

        const micBtn = document.getElementById('micBtn');
        micBtn.classList.add('recording');
        micBtn.innerText = '⏹️';

        document.getElementById('recordingIndicator').style.display = 'block';
        document.getElementById('recordTimer').innerText = '00:00';

        recordTimerInterval = setInterval(() => {
          recordSeconds++;
          const secs = recordSeconds % 60;
          const mins = Math.floor(recordSeconds / 60);
          document.getElementById('recordTimer').innerText = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

          if (recordSeconds >= 60) {
            stopVoiceRecording();
          }
        }, 1000);

      } catch (err) {
        alert("Microphone access denied or unavailable.");
      }
    }

    function stopVoiceRecording() {
      if (!isRecording || !mediaRecorder) return;
      isRecording = false;
      clearInterval(recordTimerInterval);

      if (mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }

      const micBtn = document.getElementById('micBtn');
      micBtn.classList.remove('recording');
      micBtn.innerText = '🎤';
      document.getElementById('recordingIndicator').style.display = 'none';
    }

    function setReplyTarget(msgObj) {
      selectedReplyMsg = msgObj;
      document.getElementById('replyBannerText').innerText = `Replying to ${msgObj.senderName}: "${msgObj.text.slice(0, 30)}..."`;
      document.getElementById('activeReplyBanner').style.display = 'flex';
    }

    function cancelReply() {
      selectedReplyMsg = null;
      document.getElementById('activeReplyBanner').style.display = 'none';
    }

    function sendChatMessage() {
      if (isRecording) {
        stopVoiceRecording();
      }

      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text && !pendingFile) return;

      const msgObj = {
        id: 'msg-' + Math.random().toString(36).substring(2, 9),
        senderId: localUser.id,
        senderName: localUser.name,
        avatar: localUser.avatar,
        text: text,
        file: pendingFile ? { ...pendingFile } : null,
        replyTo: selectedReplyMsg ? { senderName: selectedReplyMsg.senderName, text: selectedReplyMsg.text, isAI: selectedReplyMsg.isAI } : null,
        reactions: [],
        isAI: false
      };

      input.value = '';
      pendingFile = null;
      document.getElementById('attachmentPreview').style.display = 'none';
      cancelReply();

      renderMessage(msgObj);
      chatLogs.push(msgObj);

      broadcast({ type: 'chat', msg: msgObj });

      if (isHost) {
        checkAndTriggerAI(msgObj);
      }
    }

    function checkAndTriggerAI(msgObj) {
      const isExplicitTrigger = msgObj.text.startsWith('/g ') || msgObj.text === '/g';
      const isImageGen = msgObj.text.startsWith('/gc ');
      const isReplyToAI = msgObj.replyTo && msgObj.replyTo.isAI;

      if (isImageGen) {
        triggerImagenGen(msgObj.text.replace('/gc ', ''));
      } else if (isExplicitTrigger || isReplyToAI) {
        triggerGeminiResponse(msgObj);
      }
    }

    // AI Response generation with Quota Auto-Failover
    async function triggerGeminiResponse(triggerMsg, retryCount = 0) {
      const currentApiKey = getCurrentApiKey();
      if (!currentApiKey) {
        appendSystemNotice("⚠️ AI trigger detected, but no API Key was configured by the Host.");
        return;
      }

      if (!activeModel) {
        await findAndLockBestModel();
        if (!activeModel) {
          appendSystemNotice("⚠️ AI Error: No valid Gemini model reached.");
          return;
        }
      }

      const transcript = chatLogs.map(m => `${m.senderName}: ${m.text}`).join('\n');
      let queryText = triggerMsg.text.replace('/g ', '').replace('/g', '');

      const parts = [{
        text: `Here is the full conversation transcript so far:\n\n${transcript}\n\nThe user ${triggerMsg.senderName} sent this latest message asking for a response: "${queryText}". Answer naturally and directly as Gemini.`
      }];

      if (triggerMsg.file) {
        parts.push({
          inline_data: {
            mime_type: triggerMsg.file.mimeType,
            data: triggerMsg.file.base64
          }
        });
      }

      const requestBody = {
        contents: [{ role: 'user', parts: parts }],
        systemInstruction: {
          parts: [{ text: "You are an active participant named Gemini in a group chat. Speak naturally like a human participant without prefixes." }]
        }
      };

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${activeModel}:generateContent?key=${currentApiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(requestBody)
        });

        const resData = await res.json();

        if (res.status === 429 || (resData.error && (resData.error.code === 429 || resData.error.message.includes('quota')))) {
          if (rotateToNextApiKey() && retryCount < apiKeysPool.length) {
            activeModel = null;
            return triggerGeminiResponse(triggerMsg, retryCount + 1);
          } else {
            appendSystemNotice("⚠️ All configured API keys have exhausted their quota.");
            return;
          }
        }

        if (res.ok && resData.candidates && resData.candidates[0]?.content?.parts[0]?.text) {
          const aiText = resData.candidates[0].content.parts[0].text;

          const aiMsgObj = {
            id: 'msg-' + Math.random().toString(36).substring(2, 9),
            senderId: 'gemini-ai',
            senderName: 'Gemini (AI)',
            avatar: 'https://api.dicebear.com/7.x/bottts/svg?seed=GeminiAI',
            text: aiText,
            reactions: [],
            isAI: true
          };

          renderMessage(aiMsgObj);
          chatLogs.push(aiMsgObj);
          broadcast({ type: 'chat', msg: aiMsgObj });
        } else {
          throw new Error(resData.error?.message || 'Model request failed');
        }
      } catch (err) {
        appendSystemNotice(`⚠️ AI Generation Error: ${err.message || 'Model request failed'}`);
        activeModel = null;
        if (retryCount < apiKeysPool.length) {
          await findAndLockBestModel();
          if (activeModel) triggerGeminiResponse(triggerMsg, retryCount + 1);
        }
      }
    }

    // Real-Time Direct Image Generation using Pollinations AI
    async function triggerImagenGen(promptText) {
      appendSystemNotice(`🎨 Generating image for: "${promptText}"...`);

      const cleanPrompt = encodeURIComponent(promptText.trim());
      const randomSeed = Math.floor(Math.random() * 1000000);
      
      const generatedImageUrl = `https://image.pollinations.ai/prompt/${cleanPrompt}?width=800&height=800&seed=${randomSeed}&nologo=true&fast=true`;

      const imgLoader = new Image();
      imgLoader.src = generatedImageUrl;

      imgLoader.onload = () => {
        const aiMsgObj = {
          id: 'msg-' + Math.random().toString(36).substring(2, 9),
          senderId: 'gemini-ai',
          senderName: 'Gemini (AI)',
          avatar: 'https://api.dicebear.com/7.x/bottts/svg?seed=GeminiAI',
          text: `Generated image for: "${promptText}"`,
          file: { 
            type: 'image', 
            url: generatedImageUrl
          },
          reactions: [],
          isAI: true
        };

        renderMessage(aiMsgObj);
        chatLogs.push(aiMsgObj);
        broadcast({ type: 'chat', msg: aiMsgObj });
      };

      imgLoader.onerror = () => {
        appendSystemNotice(`⚠️ Failed to generate image for "${promptText}". Please try again.`);
      };
    }

    function sendReaction(msgId, emoji) {
      applyReactionUI(msgId, emoji, localUser.name);
      
      const msgObj = chatLogs.find(m => m.id === msgId);
      if (msgObj) {
        if (!msgObj.reactions) msgObj.reactions = [];
        msgObj.reactions.push({ emoji, senderName: localUser.name });
      }

      broadcast({ type: 'reaction', msgId: msgId, emoji: emoji, senderName: localUser.name });
    }

    function applyReactionUI(msgId, emoji, senderName) {
      const msgElem = document.getElementById(msgId);
      if (!msgElem) return;

      let rBar = msgElem.querySelector('.reactions-bar');
      if (!rBar) {
        rBar = document.createElement('div');
        rBar.className = 'reactions-bar';
        msgElem.querySelector('.message-body').appendChild(rBar);
      }

      const pill = document.createElement('span');
      pill.className = 'reaction-pill';
      pill.innerText = `${emoji} ${senderName}`;
      rBar.appendChild(pill);
    }

    function togglePicker(msgId) {
      const picker = document.getElementById(`picker-${msgId}`);
      if (picker) {
        picker.style.display = picker.style.display === 'flex' ? 'none' : 'flex';
      }
    }

    function renderMessage(msg) {
      const container = document.getElementById('messagesArea');
      const isSelf = msg.senderId === localUser.id;

      const item = document.createElement('div');
      item.className = `message-item ${isSelf ? 'self' : ''} ${msg.isAI ? 'ai' : ''}`;
      item.id = msg.id;

      let fileHTML = '';
      if (msg.file) {
        if (msg.file.type === 'image') {
          fileHTML = `<div class="media-attachment"><img src="${msg.file.url}" alt="Generated Media" loading="lazy" /></div>`;
        } else if (msg.file.type === 'audio') {
          fileHTML = `<div class="media-attachment"><audio controls src="${msg.file.url}"></audio></div>`;
        }
      }

      let replyHTML = '';
      if (msg.replyTo) {
        replyHTML = `<div class="reply-preview-badge">↩ Replying to ${msg.replyTo.senderName}: ${escapeHtml(msg.replyTo.text.slice(0, 35))}</div>`;
      }

      item.innerHTML = `
        <img class="avatar" src="${msg.avatar}" alt="avatar" onerror="this.src='https://api.dicebear.com/7.x/bottts/svg?seed=User'" />
        <div class="message-body">
          <div class="reaction-picker" id="picker-${msg.id}">
            <span onclick="sendReaction('${msg.id}', '👍'); togglePicker('${msg.id}')">👍</span>
            <span onclick="sendReaction('${msg.id}', '❤️'); togglePicker('${msg.id}')">❤️</span>
            <span onclick="sendReaction('${msg.id}', '😂'); togglePicker('${msg.id}')">😂</span>
            <span onclick="sendReaction('${msg.id}', '🔥'); togglePicker('${msg.id}')">🔥</span>
            <span onclick="sendReaction('${msg.id}', '😮'); togglePicker('${msg.id}')">😮</span>
          </div>

          <div class="sender-title">${msg.senderName}</div>
          ${replyHTML}
          <div class="bubble">${escapeHtml(msg.text)}${fileHTML}</div>
          
          <div class="msg-actions">
            <span class="action-btn" onclick="setReplyTarget(${JSON.stringify(msg).replace(/"/g, '&quot;')})">Reply</span>
            <span class="action-btn" onclick="togglePicker('${msg.id}')">React</span>
          </div>
          <div class="reactions-bar"></div>
        </div>
      `;

      container.appendChild(item);

      if (msg.reactions && msg.reactions.length > 0) {
        msg.reactions.forEach(r => applyReactionUI(msg.id, r.emoji, r.senderName));
      }

      container.scrollTop = container.scrollHeight;
    }

    function appendSystemNotice(text) {
      const container = document.getElementById('messagesArea');
      const item = document.createElement('div');
      item.style.cssText = 'text-align: center; color: #64748b; font-size: 0.8rem; margin: 8px 0;';
      item.innerText = text;
      container.appendChild(item);
      container.scrollTop = container.scrollHeight;
    }

    function copyShareLink() {
      navigator.clipboard.writeText(window.location.href);
      alert('Invite link copied to clipboard!');
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    document.getElementById('chatInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendChatMessage();
    });
  </script>
</body>
</html>
